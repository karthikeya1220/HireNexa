name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ci-dummy
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ci-dummy
      AWS_SECRET_ACCESS_KEY: ci-dummy
      S3_BUCKET_NAME: ci-dummy
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy
      SUPABASE_JWT_SECRET: ci-dummy-jwt-secret
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (app + server)
        run: npx tsc --noEmit && npx tsc -p api/tsconfig.json --noEmit

      - name: Unit tests
        run: npm test

      - name: Build server
        run: npm run build:server

      - name: Build frontend
        run: npx next build
